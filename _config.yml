# Basic Site Settings
locale: "en-US"
site_theme: "default"
title: "Junteng Liu - Homepage"
title_separator: "-"
name: &name "Junteng Liu"
description: &description "Academic homepage"
url: "https://kadorodos.github.io"
baseurl: "/LJT-Homepage"
repository: "kadorodos/LJT-Homepage"

# Site Author
author:
  avatar: "profile.png"
  name: "Junteng Liu"
  bio: "PhD candidate at HKUST NLP Group. Research in NLP and machine learning, with interests in LLM reasoning, reinforcement learning, truthfulness and interpretability, and hallucination in vision-language models."
  location: "Hong Kong"
  employer: "HKUST NLP Group"
  email: "jliugi@connect.ust.hk"

  googlescholar: "https://scholar.google.com/citations?hl=en&user=tbK9jl4AAAAJ&view_op=list_works&sortby=pubdate"
  github: "Vicent0205"

  twitter: "junteng88716710"

publication_category:
  books:
    title: 'Books'
  manuscripts:
    title: 'Journal Articles'
  conferences:
    title: 'Conference Papers'

include:
  - .htaccess
  - _pages
  - files
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .github
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - CHANGELOG
  - Capfile
  - config
  - Dockerfile
  - Gemfile
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - local
  - log
  - node_modules
  - package.json*
  - Rakefile
  - README
  - tmp
  - vendor
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

markdown: kramdown
highlighter: rouge

collections:
  teaching:
    output: true
    permalink: /:collection/:path/
  publications:
    output: true
    permalink: /:collection/:path/
  portfolio:
    output: true
    permalink: /:collection/:path/
  talks:
    output: true
    permalink: /:collection/:path/

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
